<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xóa Watermark - AI Tool</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .header p { font-size: 1.1rem; opacity: 0.9; }
        .main-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }
        .upload-area:hover { border-color: #764ba2; background: #f8f9ff; }
        .upload-icon { font-size: 4rem; color: #667eea; margin-bottom: 20px; }
        .upload-text h3 { color: #333; margin-bottom: 10px; }
        .upload-text p { color: #666; }
        #fileInput { display: none; }
        .options-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        select {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            min-width: 200px;
        }
        .btn {
            padding: 14px 40px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            text-decoration: none;
            display: inline-block;
        }
        .preview-filename {
            margin-top: 15px;
            padding: 10px 20px;
            background: #f0f0f0;
            border-radius: 8px;
            display: none;
            max-height: 150px;
            overflow-y: auto;
        }
        .file-list { list-style: none; text-align: left; }
        .file-list li { padding: 5px 0; border-bottom: 1px solid #ddd; }
        .file-list li:last-child { border-bottom: none; }
        .results-section { display: none; margin-top: 40px; }
        .results-title { text-align: center; margin-bottom: 30px; font-size: 1.5rem; }
        .images-comparison {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .image-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) { .image-pair { grid-template-columns: 1fr; } }
        .image-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        .image-card h4 { margin-bottom: 15px; }
        .image-card img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .image-card.original h4 { color: #e74c3c; }
        .image-card.processed h4 { color: #27ae60; }
        .download-section { text-align: center; margin-top: 30px; }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .loading-content { text-align: center; color: white; }
        .spinner {
            width: 60px; height: 60px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .alert-error { background: #fee; color: #c00; border: 1px solid #fcc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-magic"></i> Xóa Watermark AI</h1>
            <p>Công cụ xóa watermark thông minh sử dụng trí tuệ nhân tạo</p>
        </div>

        <div class="main-card">
            <div class="alert alert-error" id="errorAlert"></div>
            
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                <div class="upload-text">
                    <h3>Kéo thả ảnh vào đây hoặc nhấn để chọn</h3>
                    <p>Hỗ trợ: JPG, PNG, JPEG (Tối đa 16MB) - Có thể chọn nhiều ảnh</p>
                </div>
            </div>
            <input type="file" id="fileInput" accept="image/*" multiple>

            <div class="preview-filename" id="previewFilename">
                <ul class="file-list" id="fileList"></ul>
            </div>

            <div class="options-row">
                <button class="btn btn-primary" id="processBtn" disabled>
                    <i class="fas fa-wand-magic-sparkles"></i> Xóa Watermark
                </button>
            </div>

            <div class="results-section" id="resultsSection">
                <h3 class="results-title"><i class="fas fa-images"></i> Kết quả</h3>
                <div class="images-comparison" id="imagesComparison">
                    <!-- Results will be dynamically inserted here -->
                </div>
            </div>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Đang xử lý ảnh, vui lòng chờ...</p>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const previewFilename = document.getElementById('previewFilename');
        const fileList = document.getElementById('fileList');
        const resultsSection = document.getElementById('resultsSection');
        const imagesComparison = document.getElementById('imagesComparison');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorAlert = document.getElementById('errorAlert');
        let selectedFiles = [];

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = '#764ba2'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#667eea'; });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = '#667eea';
            if (e.dataTransfer.files.length > 0) handleFiles(e.dataTransfer.files);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFiles(e.target.files);
        });

        function handleFiles(files) {
            selectedFiles = [];
            fileList.innerHTML = '';
            for (let i = 0; i < files.length; i++) {
                if (!files[i].type.startsWith('image/')) continue;
                selectedFiles.push(files[i]);
                const li = document.createElement('li');
                li.textContent = '📎 ' + files[i].name;
                fileList.appendChild(li);
            }
            if (selectedFiles.length === 0) {
                showError('Vui lòng chọn file ảnh!');
                previewFilename.style.display = 'none';
                processBtn.disabled = true;
                return;
            }
            previewFilename.style.display = 'block';
            processBtn.disabled = false;
            hideError();
            resultsSection.style.display = 'none';
        }

        processBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;
            loadingOverlay.style.display = 'flex';
            hideError();
            imagesComparison.innerHTML = '';

            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    const formData = new FormData();
                    formData.append('file', selectedFiles[i]);
                    formData.append('watermark_type', 'istock');

                    const response = await fetch('/upload', { method: 'POST', body: formData });
                    const data = await response.json();
                    
                    if (data.success) {
                        const pairDiv = document.createElement('div');
                        pairDiv.className = 'image-pair';
                        pairDiv.innerHTML = `
                            <div class="image-card original">
                                <h4><i class="fas fa-image"></i> ${selectedFiles[i].name} (gốc)</h4>
                                <img src="${data.original}" alt="Original">
                            </div>
                            <div class="image-card processed">
                                <h4><i class="fas fa-check-circle"></i> Đã xóa watermark</h4>
                                <img src="${data.processed}" alt="Processed">
                                <div style="margin-top: 15px;">
                                    <a class="btn btn-success" href="${data.download}" download>
                                        <i class="fas fa-download"></i> Tải về
                                    </a>
                                </div>
                            </div>
                        `;
                        imagesComparison.appendChild(pairDiv);
                    } else {
                        showError(data.error || 'Có lỗi xảy ra khi xử lý ảnh: ' + selectedFiles[i].name);
                    }
                }
                resultsSection.style.display = 'block';
                resultsSection.scrollIntoView({ behavior: 'smooth' });
            } catch (error) {
                showError('Không thể kết nối đến server!');
            } finally {
                loadingOverlay.style.display = 'none';
            }
        });

        function showError(msg) { errorAlert.textContent = msg; errorAlert.style.display = 'block'; }
        function hideError() { errorAlert.style.display = 'none'; }
    </script>
</body>
</html>
